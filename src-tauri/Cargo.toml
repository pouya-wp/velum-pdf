[package]
name = "velum"
version = "2.0.0"
description = "Velum — a premium local-first PDF reader"
authors = ["Velum"]
edition = "2021"

[lib]
name = "velum_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
tauri = { version = "2.9.0", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
