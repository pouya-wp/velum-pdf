[package]
name = "velum"
version = "0.1.0"
description = "A beautiful, local-first PDF reader"
authors = ["Velum"]
edition = "2021"

[lib]
name = "velum_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
tauri = { version = "2.8.1", features = [] }
tauri-plugin-opener = "2.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
