name: Velum · Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create, e.g. v2.0.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: velum-release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: velum-windows-x64
          - name: macOS Apple Silicon
            os: macos-latest
            artifact: velum-macos-arm64
          - name: macOS Intel
            os: macos-15-intel
            artifact: velum-macos-x64
          - name: Linux x64
            os: ubuntu-22.04
            artifact: velum-linux-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build Velum
        run: npm run tauri:build

      - name: Upload bundle for release assembly
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all native bundles
        uses: actions/download-artifact@v7
        with:
          path: release-assets

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p publish
          find release-assets -type f \( \
            -name '*.exe' -o \
            -name '*.msi' -o \
            -name '*.dmg' -o \
            -name '*.AppImage' -o \
            -name '*.deb' \
          \) -exec cp {} publish/ \;
          echo 'Release assets:'
          find publish -maxdepth 1 -type f -printf '%f\n' | sort
          test -n "$(find publish -maxdepth 1 -type f | head -n 1)"
          gh release create "$RELEASE_TAG" publish/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Velum $RELEASE_TAG" \
            --generate-notes
