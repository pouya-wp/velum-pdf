name: Release Velum

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            args: ''
          - name: macOS Apple Silicon
            os: macos-latest
            args: '--target aarch64-apple-darwin'
          - name: macOS Intel
            os: macos-13
            args: '--target x86_64-apple-darwin'
          - name: Linux x64
            os: ubuntu-22.04
            args: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install frontend dependencies
        run: npm install
      - name: Publish release
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Velum ${{ github.ref_name }}'
          releaseBody: |
            Velum is a local-first, open-source PDF reader.

            Downloads are provided for Windows, macOS Intel, macOS Apple Silicon and Linux.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
